name: Nationwide mortgage rate monitor

on:
  workflow_dispatch:
  schedule:
    # Daily at 10:17 AM UK time, including daylight saving.
    - cron: '17 10 * * *'
      timezone: 'Europe/London'

permissions:
  contents: read

concurrency:
  group: nationwide-monitor
  cancel-in-progress: false

jobs:
  check-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Log workflow trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Schedule: $EVENT_SCHEDULE"
          TZ=Europe/London date

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python and Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check Nationwide rates
        id: purchase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python nationwide_scraper.py

      - name: Check Nationwide remortgage rates
        id: remortgage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python nationwide_remortgage_multi_ltv_updated.py --sync-supabase

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-diagnostics
          path: nationwide_diagnostic/
          retention-days: 7
          if-no-files-found: ignore

      - name: Send daily admin monitoring notification
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PURCHASE_RESULT: ${{ steps.purchase.outcome }}
          REMORTGAGE_RESULT: ${{ steps.remortgage.outcome }}
        run: |
          echo "Purchase result: $PURCHASE_RESULT"
          echo "Remortgage result: $REMORTGAGE_RESULT"

          if [ "$PURCHASE_RESULT" = "success" ] && \
             [ "$REMORTGAGE_RESULT" = "success" ]; then
            python daily_monitor_notification.py success
          else
            python daily_monitor_notification.py failure
          fi
